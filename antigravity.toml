[project]
name = "mcts-agent"
version = "0.1.0"
description = "Discriminative MCTS Agent using TypeSafe SDK (Choice, Score, Noul) + Gemini 3.8 Flash via antigravity CLI"

[run]
entrypoint = "main.py"

[dependencies]
python = ">=3.10"
packages = [
    "typesafe-sdk",
    "python-dotenv",
]

[providers]
planner = "llama_cpp"   # options: "agy", "llama_cpp", "openai", "mock"
executor = "llama_cpp"  # options: "agy", "llama_cpp", "local_cmd", "mock"

[planner]
model = "local-model"
endpoint = "http://localhost:8080/v1/chat/completions" # for llama_cpp / openai

[executor]
model = "local-model"
endpoint = "http://localhost:8080/v1/chat/completions" # for llama_cpp / openai
timeout = 1800

